name: Ecommerce Multi-Environment Deployment

on:
  push:
    branches:
      - dev
      - qa
      - production

  workflow_dispatch:
    inputs:
      action:
        description: "Select action"
        required: true
        type: choice
        options:
          - deploy
          - rollback

      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      rollback_version:
        description: "Select previous build for rollback"
        required: false
        type: choice
        options:
          - rollback-1
          - rollback-2
          - rollback-3
          - rollback-4
          - rollback-5

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: ecommerce-cluster
  CONTAINER_NAME: ecommerce-api

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'production' && 'prod' || github.ref_name) }}

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. AWS LOGIN
      # ==================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ==================================================
      # 3. LOGIN TO ECR
      # ==================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ==================================================
      # 4. SELECT ENVIRONMENT
      # ==================================================

      - name: Select Environment
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ENVIRONMENT="${{ github.event.inputs.environment }}"

          else

            BRANCH="${GITHUB_REF_NAME}"

            if [ "$BRANCH" = "dev" ]; then
              ENVIRONMENT="dev"

            elif [ "$BRANCH" = "qa" ]; then
              ENVIRONMENT="qa"

            elif [ "$BRANCH" = "production" ]; then
              ENVIRONMENT="prod"

            else
              echo "Invalid branch: $BRANCH"
              exit 1
            fi

          fi

          echo "DEPLOY_ENV=$ENVIRONMENT" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Selected Environment: $ENVIRONMENT"
          echo "======================================"


      # ==================================================
      # 5. SELECT ECR + ECS RESOURCES
      # ==================================================

      - name: Select Deployment Resources
        run: |

          if [ "$DEPLOY_ENV" = "dev" ]; then

            echo "ECR_REPOSITORY=ecommerce-api-dev" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=ecommerce-dev-service" >> "$GITHUB_ENV"
            echo "TASK_DEFINITION=.github/workflows/task-definition-dev.json" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "qa" ]; then

            echo "ECR_REPOSITORY=ecommerce-api-qa" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=ecommerce-qa-service" >> "$GITHUB_ENV"
            echo "TASK_DEFINITION=.github/workflows/task-definition-qa.json" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "prod" ]; then

            echo "ECR_REPOSITORY=ecommerce-api-prod" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=ecommerce-prod-service" >> "$GITHUB_ENV"
            echo "TASK_DEFINITION=.github/workflows/task-definition-prod.json" >> "$GITHUB_ENV"

          else

            echo "Invalid deployment environment"
            exit 1

          fi

          echo "ECR Repository : $ECR_REPOSITORY"
          echo "ECS Service    : $ECS_SERVICE"
          echo "Task Definition: $TASK_DEFINITION"


      # ==================================================
      # 6. NORMAL DEPLOYMENT - GENERATE IMAGE TAG
      # ==================================================

      - name: Generate Image Tag
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy' }}
        run: |

          VERSION="1.0"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          IMAGE_TAG="v${VERSION}.${BUILD_NUMBER}-${DEPLOY_ENV}-b${BUILD_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "NEW IMAGE"
          echo "======================================"
          echo "Version      : $VERSION"
          echo "Build Number : $BUILD_NUMBER"
          echo "Environment  : $DEPLOY_ENV"
          echo "Image Tag    : $IMAGE_TAG"
          echo "======================================"


      # ==================================================
      # 7. BUILD DOCKER IMAGE
      # ==================================================

      - name: Build Docker Image
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy' }}
        run: |

          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" .


      # ==================================================
      # 8. TAG DOCKER IMAGE
      # ==================================================

      - name: Tag Docker Image
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy' }}
        run: |

          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"


      # ==================================================
      # 9. PUSH IMAGE TO ECR
      # ==================================================

      - name: Push Docker Image
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy' }}
        run: |

          docker push \
            "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"


      # ==================================================
      # 10. GET CURRENT IMAGE FROM ECS
      # ==================================================

      - name: Get Current ECS Image
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' }}
        id: current-image
        run: |

          echo "Getting currently deployed ECS task definition..."

          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current Task Definition:"
          echo "$TASK_DEF_ARN"

          CURRENT_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --region "$AWS_REGION" \
            --query "taskDefinition.containerDefinitions[?name=='$CONTAINER_NAME'].image | [0]" \
            --output text)

          if [ -z "$CURRENT_IMAGE" ] || [ "$CURRENT_IMAGE" = "None" ]; then
            echo "Current ECS image could not be determined."
            exit 1
          fi

          CURRENT_TAG="${CURRENT_IMAGE##*:}"

          echo "CURRENT_IMAGE=$CURRENT_IMAGE" >> "$GITHUB_ENV"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"

          echo ""
          echo "======================================"
          echo "CURRENT DEPLOYED IMAGE"
          echo "======================================"
          echo "Image : $CURRENT_IMAGE"
          echo "Tag   : $CURRENT_TAG"
          echo "======================================"


      # ==================================================
      # 11. GET PREVIOUS 5 IMAGES
      # ==================================================

      - name: Get Previous 5 Rollback Images
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' }}
        run: |

          echo "Getting ECR images..."

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --filter tagStatus=TAGGED \
            --output json > all-images.json

          echo ""
          echo "======================================"
          echo "AVAILABLE ROLLBACK BUILDS"
          echo "======================================"

          jq -r --arg CURRENT_TAG "$CURRENT_TAG" '
            [
              .imageDetails[]
              | select(.imageTags != null)
              | select(.imageTags | length > 0)
              | .imageTags[0] as $tag
              | select($tag != $CURRENT_TAG)
              | {
                  tag: $tag,
                  pushedAt: .imagePushedAt,
                  digest: .imageDigest
                }
            ]
            | sort_by(.pushedAt)
            | reverse
            | .[0:5]
            | to_entries[]
            |
            (
              .value.tag
              | capture("^v(?<version>[0-9.]+)-(?<environment>[a-z]+)-b(?<build>[0-9]+)$")
            ) as $info
            |
            "Rollback-\(.key + 1) | Tag: \(.value.tag) | Version: \($info.version) | Environment: \($info.environment) | Build: \($info.build) | Pushed: \(.value.pushedAt)"
          ' all-images.json

          echo "======================================"


      # ==================================================
      # 12. SELECT ROLLBACK IMAGE
      # ==================================================

      - name: Select Rollback Image
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' }}
        run: |

          case "${{ github.event.inputs.rollback_version }}" in

            rollback-1)
              INDEX=0
              ;;

            rollback-2)
              INDEX=1
              ;;

            rollback-3)
              INDEX=2
              ;;

            rollback-4)
              INDEX=3
              ;;

            rollback-5)
              INDEX=4
              ;;

            *)
              echo "Invalid rollback selection."
              exit 1
              ;;

          esac

          IMAGE_TAG=$(jq -r --arg CURRENT_TAG "$CURRENT_TAG" --argjson INDEX "$INDEX" '
            [
              .imageDetails[]
              | select(.imageTags != null)
              | select(.imageTags | length > 0)
              | .imageTags[0] as $tag
              | select($tag != $CURRENT_TAG)
              | {
                  tag: $tag,
                  pushedAt: .imagePushedAt
                }
            ]
            | sort_by(.pushedAt)
            | reverse
            | .[$INDEX].tag
          ' all-images.json)

          if [ "$IMAGE_TAG" = "null" ] || [ -z "$IMAGE_TAG" ]; then
            echo "Selected rollback image does not exist."
            exit 1
          fi

          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          echo ""
          echo "======================================"
          echo "ROLLBACK IMAGE SELECTED"
          echo "======================================"
          echo "Environment : $DEPLOY_ENV"
          echo "Repository  : $ECR_REPOSITORY"
          echo "Image Tag   : $IMAGE_TAG"
          echo "Image URI   : $IMAGE_URI"
          echo "======================================"


      # ==================================================
      # 13. SHOW VERSION + BUILD INFORMATION
      # ==================================================

      - name: Show Selected Image Information
        run: |

          echo "======================================"
          echo "FINAL IMAGE INFORMATION"
          echo "======================================"

          echo "Environment : $DEPLOY_ENV"
          echo "Repository  : $ECR_REPOSITORY"
          echo "Image Tag   : $IMAGE_TAG"

          if [[ "$IMAGE_TAG" =~ ^v([0-9.]+)-([a-z]+)-b([0-9]+)$ ]]; then

            echo "Version     : ${BASH_REMATCH[1]}"
            echo "Environment : ${BASH_REMATCH[2]}"
            echo "Build       : ${BASH_REMATCH[3]}"

          fi

          echo "ECS Service : $ECS_SERVICE"
          echo "ECS Cluster : $ECS_CLUSTER"

          echo "======================================"


      # ==================================================
      # 14. RENDER ECS TASK DEFINITION
      # ==================================================

      - name: Render ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}


      # ==================================================
      # 15. DEPLOY TO ECS
      # ==================================================

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # ==================================================
      # 16. VERIFY ECS DEPLOYMENT
      # ==================================================

      - name: Verify ECS Deployment
        run: |

          echo "======================================"
          echo "ECS DEPLOYMENT VERIFICATION"
          echo "======================================"

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].{Service:serviceName,Status:status,Running:runningCount,Desired:desiredCount,TaskDefinition:taskDefinition}' \
            --output table

          echo ""
          echo "Deployment completed successfully."
          echo "Image deployed: $IMAGE_TAG"
          echo "======================================"