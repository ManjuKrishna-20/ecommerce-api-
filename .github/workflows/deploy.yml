name: Ecommerce Multi-Environment Deployment

on:
  push:
    branches:
      - dev
      - qa
      - production

  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: ecommerce-cluster
  CONTAINER_NAME: ecommerce-api

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Configure AWS credentials
      # ============================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # 3. Login to Amazon ECR
      # ============================================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # 4. Select Environment
      #
      # Push:
      #   dev        -> dev
      #   qa         -> qa
      #   production -> prod
      #
      # Manual:
      #   workflow_dispatch input is used
      # ============================================================
      - name: Select Environment
        id: environment
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ENVIRONMENT="${{ github.event.inputs.environment }}"

          else

            BRANCH="${GITHUB_REF_NAME}"

            if [ "$BRANCH" = "dev" ]; then

              ENVIRONMENT="dev"

            elif [ "$BRANCH" = "qa" ]; then

              ENVIRONMENT="qa"

            elif [ "$BRANCH" = "production" ]; then

              ENVIRONMENT="prod"

            else

              echo "ERROR: Invalid branch: $BRANCH"
              exit 1

            fi

          fi

          # Extra validation
          if [ "$ENVIRONMENT" != "dev" ] && \
             [ "$ENVIRONMENT" != "qa" ] && \
             [ "$ENVIRONMENT" != "prod" ]; then

            echo "ERROR: Invalid environment: $ENVIRONMENT"
            exit 1

          fi

          echo "DEPLOY_ENV=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

          echo "=============================================="
          echo "SELECTED ENVIRONMENT"
          echo "=============================================="
          echo "Environment : $ENVIRONMENT"
          echo "Branch      : ${GITHUB_REF_NAME}"
          echo "Event       : ${GITHUB_EVENT_NAME}"
          echo "=============================================="


      # ============================================================
      # 5. Select ECR repository + ECS service + task definition
      #
      # DEV
      #   ecommerce-api-dev
      #   ecommerce-dev-service
      #
      # QA
      #   ecommerce-api-qa
      #   ecommerce-qa-service
      #
      # PROD
      #   ecommerce-api-prod
      #   ecommerce-prod-service
      # ============================================================
      - name: Select Deployment Resources
        id: resources
        shell: bash
        run: |

          if [ "$DEPLOY_ENV" = "dev" ]; then

            ECR_REPOSITORY="ecommerce-api-dev"
            ECS_SERVICE="ecommerce-dev-service"
            TASK_DEFINITION=".github/workflows/task-definition-dev.json"

          elif [ "$DEPLOY_ENV" = "qa" ]; then

            ECR_REPOSITORY="ecommerce-api-qa"
            ECS_SERVICE="ecommerce-qa-service"
            TASK_DEFINITION=".github/workflows/task-definition-qa.json"

          elif [ "$DEPLOY_ENV" = "prod" ]; then

            ECR_REPOSITORY="ecommerce-api-prod"
            ECS_SERVICE="ecommerce-prod-service"
            TASK_DEFINITION=".github/workflows/task-definition-prod.json"

          else

            echo "ERROR: Invalid deployment environment"
            exit 1

          fi

          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> "$GITHUB_ENV"
          echo "ECS_SERVICE=$ECS_SERVICE" >> "$GITHUB_ENV"
          echo "TASK_DEFINITION=$TASK_DEFINITION" >> "$GITHUB_ENV"

          echo "ecr_repository=$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "ecs_service=$ECS_SERVICE" >> "$GITHUB_OUTPUT"
          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

          echo "=============================================="
          echo "DEPLOYMENT RESOURCES"
          echo "=============================================="
          echo "Environment     : $DEPLOY_ENV"
          echo "ECR Repository  : $ECR_REPOSITORY"
          echo "ECS Service     : $ECS_SERVICE"
          echo "Task Definition : $TASK_DEFINITION"
          echo "=============================================="


      # ============================================================
      # 6. Generate Docker Image Tag
      #
      # Format:
      #
      # dev-20260811-1210-b14
      # qa-20260811-1215-b15
      # prod-20260811-1230-b16
      #
      # Date/time uses IST.
      # ============================================================
      - name: Generate Image Tag
        id: image
        shell: bash
        run: |

          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          BUILD_DATE=$(TZ=Asia/Kolkata date +"%Y%m%d")
          BUILD_TIME=$(TZ=Asia/Kolkata date +"%H%M")

          IMAGE_TAG="${DEPLOY_ENV}-${BUILD_DATE}-${BUILD_TIME}-b${BUILD_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

          echo "=============================================="
          echo "DOCKER IMAGE TAG"
          echo "=============================================="
          echo "Environment : $DEPLOY_ENV"
          echo "Date        : $BUILD_DATE"
          echo "Time        : $BUILD_TIME"
          echo "Build       : $BUILD_NUMBER"
          echo "Image Tag   : $IMAGE_TAG"
          echo "=============================================="


      # ============================================================
      # 7. Build Docker Image
      # ============================================================
      - name: Build Docker Image
        shell: bash
        run: |

          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          echo "=============================================="
          echo "DOCKER BUILD SUCCESSFUL"
          echo "=============================================="
          echo "Repository : $ECR_REPOSITORY"
          echo "Image Tag  : $IMAGE_TAG"
          echo "=============================================="


      # ============================================================
      # 8. Tag Docker Image for ECR
      # ============================================================
      - name: Tag Docker Image
        shell: bash
        run: |

          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "DOCKER IMAGE TAGGED"
          echo "=============================================="
          echo "Image URI : $IMAGE_URI"
          echo "=============================================="


      # ============================================================
      # 9. Push Docker Image to ECR
      # ============================================================
      - name: Push Docker Image
        id: push
        shell: bash
        run: |

          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "=============================================="
          echo "PUSHING DOCKER IMAGE"
          echo "=============================================="
          echo "Environment : $DEPLOY_ENV"
          echo "Repository  : $ECR_REPOSITORY"
          echo "Image Tag   : $IMAGE_TAG"
          echo "Image URI   : $IMAGE_URI"
          echo "=============================================="

          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "=============================================="
          echo "IMAGE PUSH SUCCESSFUL"
          echo "=============================================="


      # ============================================================
      # 10. Verify image exists in ECR
      # ============================================================
      - name: Verify ECR Image
        shell: bash
        run: |

          echo "=============================================="
          echo "VERIFYING ECR IMAGE"
          echo "=============================================="

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].{
              Tag:imageTags[0],
              Digest:imageDigest,
              PushedAt:imagePushedAt,
              Size:imageSizeInBytes
            }' \
            --output table

          echo "=============================================="
          echo "ECR IMAGE VERIFIED"
          echo "=============================================="


      # ============================================================
      # 11. Show Current Image Information
      # ============================================================
      - name: Show Image Information
        shell: bash
        run: |

          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "=============================================="
          echo "DEPLOYMENT IMAGE INFORMATION"
          echo "=============================================="
          echo "Environment : $DEPLOY_ENV"
          echo "Repository  : $ECR_REPOSITORY"
          echo "Image Tag   : $IMAGE_TAG"
          echo "Build       : $GITHUB_RUN_NUMBER"
          echo "Image URI   : $IMAGE_URI"
          echo "=============================================="


      # ============================================================
      # 12. Show Latest 5 Builds
      #
      # IMPORTANT:
      #
      # This sorts by BUILD NUMBER, not ECR push time.
      #
      # It supports both:
      #
      # New:
      # dev-20260811-1210-b16
      #
      # Old:
      # v1.0.16-dev-b16
      #
      # Output:
      #
      # BUILD    IMAGE TAG
      # 16       dev-20260811-1210-b16
      # 15       dev-20260811-1205-b15
      # 14       dev-20260811-1158-b14
      # 13       dev-20260811-1150-b13
      # 12       dev-20260811-1145-b12
      # ============================================================
      - name: Show Latest 5 ECR Builds
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo "LATEST 5 BUILDS"
          echo "=============================================="
          echo "Environment : $DEPLOY_ENV"
          echo "Repository  : $ECR_REPOSITORY"
          echo "=============================================="

          # --------------------------------------------------------
          # Get all tagged ECR images.
          # --------------------------------------------------------

          IMAGE_DATA=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --output json)

          # --------------------------------------------------------
          # Extract:
          #
          # Build number
          # Image tag
          # Push time
          #
          # Supports:
          #   dev-...-b16
          #   qa-...-b16
          #   prod-...-b16
          #
          # and old:
          #   v1.0.16-dev-b16
          # --------------------------------------------------------

          echo "$IMAGE_DATA" | jq -r '
            [
              .imageDetails[]
              | select(.imageTags != null)
              | . as $image
              | $image.imageTags[]
              | select(test("-b[0-9]+$"))
              | {
                  tag: .,
                  build: (capture("-b(?<number>[0-9]+)$").number | tonumber),
                  pushedAt: $image.imagePushedAt
                }
            ]
            | sort_by(.build, .pushedAt)
            | reverse
            | unique_by(.build)
            | .[:5]
            | .[]
            | "\(.build)|\(.tag)|\(.pushedAt)"
          ' > /tmp/latest5.txt

          # --------------------------------------------------------
          # Conditional:
          #
          # If no matching images exist, don't fail deployment.
          # --------------------------------------------------------

          if [ ! -s /tmp/latest5.txt ]; then

            echo ""
            echo "No matching build images found."
            echo "The repository may be empty or the image tags"
            echo "may not contain a -b<number> build suffix."

          else

            printf "%-8s %-55s %-30s\n" \
              "BUILD" \
              "IMAGE TAG" \
              "PUSHED AT"

            printf "%-8s %-55s %-30s\n" \
              "-----" \
              "---------" \
              "--------"

            while IFS='|' read -r BUILD TAG PUSHED_AT
            do

              printf "%-8s %-55s %-30s\n" \
                "$BUILD" \
                "$TAG" \
                "$PUSHED_AT"

            done < /tmp/latest5.txt

          fi

          echo ""
          echo "=============================================="
          echo "LATEST 5 BUILDS COMPLETED"
          echo "=============================================="


      # ============================================================
      # 13. Validate Task Definition
      # ============================================================
      - name: Validate Task Definition
        shell: bash
        run: |

          echo "=============================================="
          echo "VALIDATING TASK DEFINITION"
          echo "=============================================="

          python -m json.tool "$TASK_DEFINITION" > /dev/null

          echo "Valid JSON:"
          echo "$TASK_DEFINITION"

          echo "=============================================="


      # ============================================================
      # 14. Render ECS Task Definition
      #
      # Use the exact image URI from the push step.
      # ============================================================
      - name: Render ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.push.outputs.image_uri }}


      # ============================================================
      # 15. Show Rendered Task Definition
      # ============================================================
      - name: Show Rendered Task Definition
        shell: bash
        run: |

          echo "=============================================="
          echo "RENDERED ECS TASK DEFINITION"
          echo "=============================================="

          cat "${{ steps.task-def.outputs.task-definition }}"

          echo "=============================================="


      # ============================================================
      # 16. Deploy to ECS
      # ============================================================
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # ============================================================
      # 17. Verify ECS Deployment
      # ============================================================
      - name: Verify ECS Deployment
        shell: bash
        run: |

          echo "=============================================="
          echo "ECS DEPLOYMENT VERIFICATION"
          echo "=============================================="

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].{
              Service:serviceName,
              Status:status,
              Running:runningCount,
              Desired:desiredCount,
              Pending:pendingCount,
              TaskDefinition:taskDefinition
            }' \
            --output table

          echo "=============================================="
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=============================================="

          echo "Environment : $DEPLOY_ENV"
          echo "Repository  : $ECR_REPOSITORY"
          echo "Image       : $IMAGE_TAG"
          echo "Service     : $ECS_SERVICE"

          echo "=============================================="