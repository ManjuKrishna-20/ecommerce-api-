name: Multi Environment AWS ECS Deployment

on:

  # ============================================================
  # AUTOMATIC DEPLOYMENT
  # ============================================================

  push:
    branches:
      - dev
      - qa
      - production

  # ============================================================
  # MANUAL DEPLOYMENT
  # ============================================================

  workflow_dispatch:
    inputs:

      environment:
        description: "Select target environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      deploy_tag:
        description: "Select image version to deploy"
        required: true
        type: choice
        options:
          - latest
          - latest-1
          - latest-2
          - latest-3
          - latest-4


# ==============================================================
# PERMISSIONS
# ==============================================================

permissions:
  contents: read


# ==============================================================
# GLOBAL VARIABLES
# ==============================================================

env:

  AWS_REGION: ap-south-1

  ECS_CLUSTER: ecommerce-cluster

  IMAGE_NAME: ecommerce-api

  DEV_ECR_REPOSITORY: ecommerce-api-dev
  QA_ECR_REPOSITORY: ecommerce-api-qa
  PROD_ECR_REPOSITORY: ecommerce-api-prod

  DEV_ECS_SERVICE: ecommerce-dev-service
  QA_ECS_SERVICE: ecommerce-qa-service
  PROD_ECS_SERVICE: ecommerce-prod-service

  DEV_TASK_DEFINITION: .github/workflows/task-definition-dev.json
  QA_TASK_DEFINITION: .github/workflows/task-definition-qa.json
  PROD_TASK_DEFINITION: .github/workflows/task-definition-prod.json

  CONTAINER_NAME: ecommerce-api

  DESIRED_COUNT: 3


# ==============================================================
# JOB
# ==============================================================

jobs:

  deploy:

    runs-on: ubuntu-latest

    # GitHub Environment
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'production' && 'prod' || github.ref_name) }}


    steps:


      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout

        uses: actions/checkout@v4


      # ========================================================
      # AWS LOGIN
      # ========================================================

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # LOGIN TO ECR
      # ========================================================

      - name: Login to Amazon ECR

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2


      # ========================================================
      # DECIDE ENVIRONMENT
      # ========================================================

      - name: Decide Environment

        shell: bash

        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ENV="${{ github.event.inputs.environment }}"

          else

            BRANCH="${GITHUB_REF_NAME}"


            if [ "$BRANCH" = "dev" ]; then

              ENV="dev"


            elif [ "$BRANCH" = "qa" ]; then

              ENV="qa"


            elif [ "$BRANCH" = "production" ]; then

              ENV="prod"


            else

              echo "Unsupported branch: $BRANCH"

              exit 1

            fi

          fi


          echo "DEPLOY_ENV=$ENV" >> "$GITHUB_ENV"


          echo "=========================================="

          echo "Deployment Environment: $ENV"

          echo "=========================================="


      # ========================================================
      # SELECT ECR + ECS SERVICE
      # ========================================================

      - name: Select ECR and ECS Resources

        shell: bash

        run: |

          if [ "$DEPLOY_ENV" = "dev" ]; then

            echo "ECR_REPOSITORY=$DEV_ECR_REPOSITORY" >> "$GITHUB_ENV"

            echo "ECS_SERVICE=$DEV_ECS_SERVICE" >> "$GITHUB_ENV"

            echo "TASK_DEFINITION=$DEV_TASK_DEFINITION" >> "$GITHUB_ENV"


          elif [ "$DEPLOY_ENV" = "qa" ]; then

            echo "ECR_REPOSITORY=$QA_ECR_REPOSITORY" >> "$GITHUB_ENV"

            echo "ECS_SERVICE=$QA_ECS_SERVICE" >> "$GITHUB_ENV"

            echo "TASK_DEFINITION=$QA_TASK_DEFINITION" >> "$GITHUB_ENV"


          elif [ "$DEPLOY_ENV" = "prod" ]; then

            echo "ECR_REPOSITORY=$PROD_ECR_REPOSITORY" >> "$GITHUB_ENV"

            echo "ECS_SERVICE=$PROD_ECS_SERVICE" >> "$GITHUB_ENV"

            echo "TASK_DEFINITION=$PROD_TASK_DEFINITION" >> "$GITHUB_ENV"


          else

            echo "Unsupported environment"

            exit 1

          fi


          echo "=========================================="

          echo "ECR Repository  : $ECR_REPOSITORY"

          echo "ECS Service     : $ECS_SERVICE"

          echo "Task Definition : $TASK_DEFINITION"

          echo "=========================================="


      # ========================================================
      # CHECK ECR REPOSITORY
      # ========================================================

      - name: Check ECR Repository

        shell: bash

        run: |

          echo "Checking ECR repository: $ECR_REPOSITORY"


          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --output table


      # ========================================================
      # GENERATE / SELECT IMAGE
      #
      # PUSH:
      #   Always creates NEW image.
      #
      # MANUAL latest:
      #   Creates NEW image.
      #
      # MANUAL latest-1/-2/-3/-4:
      #   Uses EXISTING image.
      # ========================================================

      - name: Generate or Select Image

        shell: bash

        run: |

          # ======================================================
          # VERSION
          #
          # Same concept as Azure:
          #
          # VERSION="${{ vars.VERSION }}"
          #
          # If VERSION is configured in GitHub Environment
          # Variables, it will be used.
          # ======================================================


          VERSION="${{ vars.VERSION }}"


          if [ -z "$VERSION" ]; then

            VERSION="1.0"

            echo "WARNING: VERSION variable is not configured."

            echo "Using default VERSION=$VERSION"

          fi


          PREFIX="v${VERSION}-${DEPLOY_ENV}-b"


          echo "=========================================="

          echo "VERSION : $VERSION"

          echo "PREFIX  : $PREFIX"

          echo "ECR     : $ECR_REPOSITORY"

          echo "=========================================="


          # ======================================================
          # AUTOMATIC PUSH
          #
          # Every branch push creates NEW image.
          # ======================================================

          if [ "${{ github.event_name }}" = "push" ]; then

            echo "Automatic branch deployment."

            echo "Creating a NEW image."


            TAGS=$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --query 'imageDetails[?imageTags != null].imageTags[]' \
              --output json)


            MAX_BUILD=$(echo "$TAGS" | jq -r --arg prefix "$PREFIX" '

              map(

                select(startswith($prefix))

                | capture("b(?<number>[0-9]+)$").number

                | tonumber

              )

              | if length == 0 then

                  0

                else

                  max

                end

            ')


            NEXT_BUILD=$((MAX_BUILD + 1))


            IMAGE_TAG="${PREFIX}${NEXT_BUILD}"


            echo "=========================================="

            echo "Existing highest build : b$MAX_BUILD"

            echo "New build number       : b$NEXT_BUILD"

            echo "New image tag          : $IMAGE_TAG"

            echo "=========================================="


            echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

            echo "BUILD_NEW_IMAGE=true" >> "$GITHUB_ENV"


          # ======================================================
          # MANUAL DEPLOYMENT
          # ======================================================

          else

            SELECTED_TAG="${{ github.event.inputs.deploy_tag }}"


            echo "Manual deployment selected: $SELECTED_TAG"


            # ====================================================
            # MANUAL latest
            #
            # latest = CREATE NEW IMAGE
            # ====================================================

            if [ "$SELECTED_TAG" = "latest" ]; then

              echo "latest selected."

              echo "Creating a NEW image."


              TAGS=$(aws ecr describe-images \
                --repository-name "$ECR_REPOSITORY" \
                --region "$AWS_REGION" \
                --query 'imageDetails[?imageTags != null].imageTags[]' \
                --output json)


              MAX_BUILD=$(echo "$TAGS" | jq -r --arg prefix "$PREFIX" '

                map(

                  select(startswith($prefix))

                  | capture("b(?<number>[0-9]+)$").number

                  | tonumber

                )

                | if length == 0 then

                    0

                  else

                    max

                  end

              ')


              NEXT_BUILD=$((MAX_BUILD + 1))


              IMAGE_TAG="${PREFIX}${NEXT_BUILD}"


              echo "=========================================="

              echo "Existing highest build : b$MAX_BUILD"

              echo "New build number       : b$NEXT_BUILD"

              echo "New image tag          : $IMAGE_TAG"

              echo "=========================================="


              echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

              echo "BUILD_NEW_IMAGE=true" >> "$GITHUB_ENV"


            # ====================================================
            # MANUAL latest-1/-2/-3/-4
            #
            # EXISTING IMAGE
            # ====================================================

            else

              INDEX=$(echo "$SELECTED_TAG" | sed 's/latest-//')


              echo "Rollback index: $INDEX"


              TAGS=$(aws ecr describe-images \
                --repository-name "$ECR_REPOSITORY" \
                --region "$AWS_REGION" \
                --query 'imageDetails[?imageTags != null].imageTags[]' \
                --output json)


              # ==================================================
              # SORT BY BUILD NUMBER DESCENDING
              # ==================================================

              SORTED_TAGS=$(echo "$TAGS" | jq -r --arg prefix "$PREFIX" '

                map(

                  select(startswith($prefix))

                  |

                  {

                    tag: .,

                    number:
                      (
                        capture("b(?<number>[0-9]+)$").number
                        | tonumber
                      )

                  }

                )

                | sort_by(.number)

                | reverse

                | map(.tag)

              ')


              echo "=========================================="

              echo "Available images:"

              echo "$SORTED_TAGS"

              echo "=========================================="


              # ==================================================
              # IMPORTANT
              #
              # latest-1 = second newest
              # latest-2 = third newest
              # latest-3 = fourth newest
              # latest-4 = fifth newest
              # ==================================================

              IMAGE_TAG=$(echo "$SORTED_TAGS" | jq -r ".[$INDEX]")


              if [ "$IMAGE_TAG" = "null" ] || [ -z "$IMAGE_TAG" ]; then

                echo "ERROR: Requested image does not exist."

                echo ""

                echo "Available images:"

                echo "$SORTED_TAGS"

                exit 1

              fi


              echo "=========================================="

              echo "Existing image selected:"

              echo "$IMAGE_TAG"

              echo "=========================================="


              echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

              echo "BUILD_NEW_IMAGE=false" >> "$GITHUB_ENV"

            fi

          fi


      # ========================================================
      # BUILD DOCKER IMAGE
      #
      # ONLY FOR NEW IMAGES
      # ========================================================

      - name: Build Docker Image

        if: env.BUILD_NEW_IMAGE == 'true'

        shell: bash

        run: |

          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"


          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


          echo "=========================================="

          echo "BUILDING NEW IMAGE"

          echo "=========================================="


          echo "$FULL_IMAGE"


          docker build \
            -t "$FULL_IMAGE" \
            .


      # ========================================================
      # PUSH DOCKER IMAGE
      #
      # ONLY FOR NEW IMAGES
      # ========================================================

      - name: Push Docker Image

        if: env.BUILD_NEW_IMAGE == 'true'

        shell: bash

        run: |

          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"


          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


          echo "=========================================="

          echo "PUSHING NEW IMAGE"

          echo "=========================================="


          echo "$FULL_IMAGE"


          docker push "$FULL_IMAGE"


      # ========================================================
      # VERIFY ECR IMAGE
      # ========================================================

      - name: Verify ECR Image

        shell: bash

        run: |

          echo "=========================================="

          echo "VERIFYING ECR IMAGE"

          echo "=========================================="


          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].{
              Tag:imageTags[0],
              Digest:imageDigest,
              Size:imageSizeInBytes,
              Pushed:imagePushedAt
            }' \
            --output table


      # ========================================================
      # CHECK ECS SERVICE
      #
      # Azure equivalent:
      # az containerapp show
      # ========================================================

      - name: Check ECS Service

        shell: bash

        run: |

          echo "=========================================="

          echo "CHECKING ECS SERVICE"

          echo "=========================================="


          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].{
              Service:serviceName,
              Status:status,
              Desired:desiredCount,
              Running:runningCount
            }' \
            --output table


      # ========================================================
      # RENDER ECS TASK DEFINITION
      # ========================================================

      - name: Render ECS Task Definition

        id: task-def

        uses: aws-actions/amazon-ecs-render-task-definition@v1

        with:

          task-definition: ${{ env.TASK_DEFINITION }}

          container-name: ${{ env.CONTAINER_NAME }}

          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}


      # ========================================================
      # DEPLOY ECS
      #
      # Azure equivalent:
      # az containerapp update --image
      # ========================================================

      - name: Deploy ECS Service

        uses: aws-actions/amazon-ecs-deploy-task-definition@v2

        with:

          task-definition: ${{ steps.task-def.outputs.task-definition }}

          service: ${{ env.ECS_SERVICE }}

          cluster: ${{ env.ECS_CLUSTER }}

          wait-for-service-stability: false


      # ========================================================
      # ENSURE 3 TASKS
      # ========================================================

      - name: Set ECS Desired Count

        shell: bash

        run: |

          echo "=========================================="

          echo "SETTING ECS DESIRED COUNT"

          echo "=========================================="


          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count "$DESIRED_COUNT" \
            --region "$AWS_REGION"


          echo "Desired tasks: $DESIRED_COUNT"


      # ========================================================
      # WAIT FOR DEPLOYMENT
      # ========================================================

      - name: Wait For ECS Deployment

        shell: bash

        run: |

          echo "=========================================="

          echo "WAITING FOR ECS DEPLOYMENT"

          echo "=========================================="


          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"


          echo "ECS service is stable."


      # ========================================================
      # VERIFY DEPLOYMENT
      # ========================================================

      - name: Verify Deployment

        shell: bash

        run: |

          EXPECTED_IMAGE="${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"


          echo "=========================================="

          echo "DEPLOYMENT VERIFICATION"

          echo "=========================================="


          echo "Environment      : $DEPLOY_ENV"

          echo "ECR              : $ECR_REPOSITORY"

          echo "ECS Service      : $ECS_SERVICE"

          echo "Selected Tag     : $IMAGE_TAG"

          echo "Expected Image   : $EXPECTED_IMAGE"


          echo "=========================================="


          RUNNING_COUNT=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].runningCount' \
            --output text)


          DESIRED=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].desiredCount' \
            --output text)


          echo "Running Tasks : $RUNNING_COUNT"

          echo "Desired Tasks : $DESIRED"


          if [ "$RUNNING_COUNT" -lt "$DESIRED_COUNT" ]; then

            echo "DEPLOYMENT VERIFICATION FAILED"

            echo "Expected running tasks: $DESIRED_COUNT"

            echo "Actual running tasks: $RUNNING_COUNT"

            exit 1

          fi


          echo "=========================================="

          echo "DEPLOYMENT SUCCESSFUL"

          echo "ECS service is running the required tasks."

          echo "=========================================="


      # ========================================================
      # SHOW RUNNING TASKS
      # ========================================================

      - name: Show Running ECS Tasks

        shell: bash

        run: |

          echo "=========================================="

          echo "RUNNING ECS TASKS"

          echo "=========================================="


          TASK_ARNS=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status RUNNING \
            --region "$AWS_REGION" \
            --query 'taskArns[]' \
            --output text)


          if [ -z "$TASK_ARNS" ]; then

            echo "No running ECS tasks found."

            exit 1

          fi


          aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks $TASK_ARNS \
            --region "$AWS_REGION" \
            --query 'tasks[].{
              Task:taskArn,
              Status:lastStatus,
              Desired:desiredStatus,
              Health:healthStatus,
              TaskDefinition:taskDefinitionArn
            }' \
            --output table


      # ========================================================
      # FINAL SUMMARY
      # ========================================================

      - name: Deployment Summary

        shell: bash

        run: |

          echo ""

          echo "======================================================"

          echo "             DEPLOYMENT COMPLETED"

          echo "======================================================"

          echo "Environment       : $DEPLOY_ENV"

          echo "ECR Repository    : $ECR_REPOSITORY"

          echo "ECS Service       : $ECS_SERVICE"

          echo "Image Tag         : $IMAGE_TAG"

          echo "New Image         : $BUILD_NEW_IMAGE"

          echo "Desired Tasks     : $DESIRED_COUNT"

          echo "GitHub Run        : $GITHUB_RUN_NUMBER"

          echo "======================================================"