name: Multi Environment Deployment

on:
  push:
    branches:
      - dev
      - qa
      - production

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - production

env:
  AWS_REGION: ap-south-1

  ECR_REPOSITORY: ecommerce-api

  ECS_CLUSTER: ecommerce-cluster

  CONTAINER_NAME: ecommerce-api

  DEV_SERVICE: ecommerce-dev-service
  QA_SERVICE: ecommerce-qa-service
  PROD_SERVICE: ecommerce-prod-service

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}

    steps:

###############################################################

    - name: Checkout Repository
      uses: actions/checkout@v4

###############################################################

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

###############################################################

    - name: Login Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

###############################################################

    - name: Decide Environment
      run: |

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          ENV=${{ github.event.inputs.environment }}
        else
          ENV=${GITHUB_REF_NAME}
        fi

        echo "DEPLOY_ENV=$ENV" >> $GITHUB_ENV

###############################################################

    - name: Generate Image Version
      run: |

        IMAGE_TAG=v1.0.${{ github.run_number }}

        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

###############################################################

    - name: Build Docker Image
      run: |

        docker build \
          -t $ECR_REPOSITORY:$IMAGE_TAG .

###############################################################

    - name: Tag Docker Image
      run: |

        docker tag \
        $ECR_REPOSITORY:$IMAGE_TAG \
        ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

###############################################################

    - name: Push Docker Image
      run: |

        docker push \
        ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

###############################################################

    - name: Select ECS Service
      run: |

        if [ "$DEPLOY_ENV" = "dev" ]; then

          echo "SERVICE=$DEV_SERVICE" >> $GITHUB_ENV
          echo "TASK=.github/workflows/task-definition-dev.json" >> $GITHUB_ENV

        elif [ "$DEPLOY_ENV" = "qa" ]; then

          echo "SERVICE=$QA_SERVICE" >> $GITHUB_ENV
          echo "TASK=.github/workflows/task-definition-qa.json" >> $GITHUB_ENV

        else

          echo "SERVICE=$PROD_SERVICE" >> $GITHUB_ENV
          echo "TASK=.github/workflows/task-definition-prod.json" >> $GITHUB_ENV

        fi

###############################################################

    - name: Render Task Definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.TASK }}
        container-name: ecommerce-api
        image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

###############################################################

    - name: Deploy ECS Service
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

###############################################################

    - name: Verify Deployment
      run: |

        aws ecs describe-services \
        --cluster $ECS_CLUSTER \
        --services $SERVICE