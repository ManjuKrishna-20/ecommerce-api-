    steps:

      # ============================================================
      # 1. Checkout source code
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Configure AWS Credentials
      # ============================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # 3. Login to Amazon ECR
      # ============================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # 4. Select Deployment Environment
      # ============================================================

      - name: Select Environment
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ENVIRONMENT="${{ github.event.inputs.environment }}"

          else

            BRANCH="${GITHUB_REF_NAME}"

            if [ "$BRANCH" = "dev" ]; then
              ENVIRONMENT="dev"

            elif [ "$BRANCH" = "qa" ]; then
              ENVIRONMENT="qa"

            elif [ "$BRANCH" = "production" ]; then
              ENVIRONMENT="prod"

            else
              echo "ERROR: Unsupported branch: $BRANCH"
              exit 1
            fi

          fi

          echo "DEPLOY_ENV=$ENVIRONMENT" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "DEPLOYMENT ENVIRONMENT"
          echo "=========================================="
          echo "Environment: $ENVIRONMENT"
          echo "=========================================="


      # ============================================================
      # 5. Select ECR + ECS + Task Definition
      # ============================================================

      - name: Select Deployment Resources
        shell: bash
        run: |

          if [ "$DEPLOY_ENV" = "dev" ]; then

            echo "ECR_REPOSITORY=$DEV_ECR_REPOSITORY" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=$DEV_ECS_SERVICE" >> "$GITHUB_ENV"
            echo "TASK_DEFINITION=.github/workflows/task-definition-dev.json" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "qa" ]; then

            echo "ECR_REPOSITORY=$QA_ECR_REPOSITORY" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=$QA_ECS_SERVICE" >> "$GITHUB_ENV"
            echo "TASK_DEFINITION=.github/workflows/task-definition-qa.json" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "prod" ]; then

            echo "ECR_REPOSITORY=$PROD_ECR_REPOSITORY" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=$PROD_ECS_SERVICE" >> "$GITHUB_ENV"
            echo "TASK_DEFINITION=.github/workflows/task-definition-prod.json" >> "$GITHUB_ENV"

          else

            echo "ERROR: Invalid deployment environment: $DEPLOY_ENV"
            exit 1

          fi

          echo "=========================================="
          echo "DEPLOYMENT RESOURCES"
          echo "=========================================="
          echo "Environment     : $DEPLOY_ENV"
          echo "ECR Repository  : $ECR_REPOSITORY"
          echo "ECS Service     : $ECS_SERVICE"
          echo "Task Definition : $TASK_DEFINITION"
          echo "=========================================="


      # ============================================================
      # 6. Generate Image Version
      #
      # Only for normal git push.
      #
      # Example:
      # v1.0.15-dev-b15
      # v1.0.16-qa-b16
      # v1.0.17-prod-b17
      # ============================================================

      - name: Generate Image Version
        if: github.event_name == 'push'
        shell: bash
        run: |

          VERSION="1.0"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          IMAGE_TAG="v${VERSION}.${BUILD_NUMBER}-${DEPLOY_ENV}-b${BUILD_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "NEW IMAGE VERSION"
          echo "=========================================="
          echo "Version      : $VERSION"
          echo "Build Number : $BUILD_NUMBER"
          echo "Environment  : $DEPLOY_ENV"
          echo "Image Tag    : $IMAGE_TAG"
          echo "=========================================="


      # ============================================================
      # 7. Build Docker Image
      #
      # Only for normal git push.
      # Manual deployment uses an existing ECR image.
      # ============================================================

      - name: Build Docker Image
        if: github.event_name == 'push'
        shell: bash
        run: |

          echo "=========================================="
          echo "BUILDING DOCKER IMAGE"
          echo "=========================================="

          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          echo "Docker image built successfully."


      # ============================================================
      # 8. Tag Docker Image
      # ============================================================

      - name: Tag Docker Image
        if: github.event_name == 'push'
        shell: bash
        run: |

          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Docker image tagged successfully."

          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"


      # ============================================================
      # 9. Push Docker Image to ECR
      # ============================================================

      - name: Push Docker Image
        if: github.event_name == 'push'
        shell: bash
        run: |

          echo "=========================================="
          echo "PUSHING DOCKER IMAGE TO ECR"
          echo "=========================================="

          echo "Repository : $ECR_REPOSITORY"
          echo "Image Tag  : $IMAGE_TAG"
          echo "Image URI  : $IMAGE_URI"

          docker push "$IMAGE_URI"

          echo "=========================================="
          echo "IMAGE PUSHED SUCCESSFULLY"
          echo "=========================================="


      # ============================================================
