name: Ecommerce CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - qa
      - production

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - production

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ecommerce-api
  ECS_CLUSTER: ecommerce-cluster
  CONTAINER_NAME: ecommerce-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Environment
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV=${{ github.event.inputs.environment }}
          else
            ENV=${GITHUB_REF_NAME}
          fi

          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

          case $ENV in
            dev)
              echo "SERVICE=ecommerce-dev-service" >> $GITHUB_ENV
              echo "TASK=.github/workflows/task-definition-dev.json" >> $GITHUB_ENV
              ;;
            qa)
              echo "SERVICE=ecommerce-qa-service" >> $GITHUB_ENV
              echo "TASK=.github/workflows/task-definition-qa.json" >> $GITHUB_ENV
              ;;
            production)
              echo "SERVICE=ecommerce-prod-service" >> $GITHUB_ENV
              echo "TASK=.github/workflows/task-definition-prod.json" >> $GITHUB_ENV
              ;;
            *)
              echo "Invalid Environment"
              exit 1
              ;;
          esac

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .

      - name: Tag Docker Image
        run: |
          docker tag \
          $ECR_REPOSITORY:$IMAGE_TAG \
          ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push Docker Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Render Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify Deployment
        run: |
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $SERVICE