name: Ecommerce AWS ECS Deployment

on:

  # ============================================================
  # AUTOMATIC DEPLOYMENT
  # ============================================================

  push:
    branches:
      - dev
      - qa
      - production

  # ============================================================
  # MANUAL DEPLOYMENT
  # ============================================================

  workflow_dispatch:

    inputs:

      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      deployment_type:
        description: "Select deployment type"
        required: true
        type: choice
        options:
          - new
          - latest
          - latest-1
          - latest-2
          - latest-3
          - latest-4


# ==============================================================
# PREVENT TWO DEPLOYMENTS TO SAME ENVIRONMENT AT SAME TIME
# ==============================================================

concurrency:
  group: ecommerce-deploy-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false


permissions:
  contents: read


# ==============================================================
# GLOBAL VARIABLES
# ==============================================================

env:

  AWS_REGION: ap-south-1

  ECS_CLUSTER: ecommerce-cluster

  CONTAINER_NAME: ecommerce-api

  DESIRED_COUNT: 3

  MINIMUM_HEALTHY_PERCENT: 100

  MAXIMUM_PERCENT: 200


jobs:

  deploy:

    name: Ecommerce Deployment

    runs-on: ubuntu-latest


    steps:


      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ========================================================
      # 2. CONFIGURE AWS
      # ========================================================

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # 3. LOGIN TO ECR
      # ========================================================

      - name: Login to Amazon ECR

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2


      # ========================================================
      # 4. SELECT ENVIRONMENT
      # ========================================================

      - name: Select Environment

        shell: bash

        run: |

          echo "=========================================="
          echo "SELECTING ENVIRONMENT"
          echo "=========================================="


          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ENVIRONMENT="${{ github.event.inputs.environment }}"

          else

            case "$GITHUB_REF_NAME" in

              dev)
                ENVIRONMENT="dev"
                ;;

              qa)
                ENVIRONMENT="qa"
                ;;

              production)
                ENVIRONMENT="prod"
                ;;

              *)
                echo "ERROR: Invalid branch: $GITHUB_REF_NAME"
                exit 1
                ;;

            esac

          fi


          echo "DEPLOY_ENV=$ENVIRONMENT" >> "$GITHUB_ENV"


          echo "Environment: $ENVIRONMENT"

          echo "=========================================="


      # ========================================================
      # 5. SELECT ECR + ECS RESOURCES
      # ========================================================

      - name: Select Deployment Resources

        shell: bash

        run: |

          echo "=========================================="
          echo "SELECTING AWS RESOURCES"
          echo "=========================================="


          case "$DEPLOY_ENV" in

            dev)

              echo "ECR_REPOSITORY=ecommerce-api-dev" >> "$GITHUB_ENV"

              echo "ECS_SERVICE=ecommerce-dev-service" >> "$GITHUB_ENV"

              echo "TASK_DEFINITION=.github/workflows/task-definition-dev.json" >> "$GITHUB_ENV"

              ;;


            qa)

              echo "ECR_REPOSITORY=ecommerce-api-qa" >> "$GITHUB_ENV"

              echo "ECS_SERVICE=ecommerce-qa-service" >> "$GITHUB_ENV"

              echo "TASK_DEFINITION=.github/workflows/task-definition-qa.json" >> "$GITHUB_ENV"

              ;;


            prod)

              echo "ECR_REPOSITORY=ecommerce-api-prod" >> "$GITHUB_ENV"

              echo "ECS_SERVICE=ecommerce-prod-service" >> "$GITHUB_ENV"

              echo "TASK_DEFINITION=.github/workflows/task-definition-prod.json" >> "$GITHUB_ENV"

              ;;


            *)

              echo "ERROR: Invalid deployment environment"

              exit 1

              ;;

          esac


          echo ""
          echo "Environment     : $DEPLOY_ENV"
          echo "ECR Repository  : $ECR_REPOSITORY"
          echo "ECS Service     : $ECS_SERVICE"
          echo "Task Definition : $TASK_DEFINITION"
          echo "Desired Tasks   : $DESIRED_COUNT"

          echo "=========================================="


      # ========================================================
      # 6. CHECK ECR REPOSITORY
      # ========================================================

      - name: Check ECR Repository

        shell: bash

        run: |

          echo "=========================================="
          echo "CHECKING ECR REPOSITORY"
          echo "=========================================="


          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --output table


      # ========================================================
      # 7. SHOW ALL EXISTING IMAGES
      # ========================================================

      - name: Show All Existing ECR Images

        shell: bash

        run: |

          echo "=========================================="
          echo "ALL EXISTING ECR IMAGES"
          echo "=========================================="


          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'imageDetails[?imageTags != null].[imageTags[0],imagePushedAt,imageDigest]' \
            --output table || true


      # ========================================================
      # 8. GET ENVIRONMENT BUILD TAGS
      # ========================================================

      - name: Get Environment Build Tags

        shell: bash

        run: |

          echo "=========================================="
          echo "GETTING ENVIRONMENT BUILDS"
          echo "=========================================="


          rm -f builds.txt
          rm -f all-tags.txt

          touch builds.txt


          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'imageDetails[].imageTags[]' \
            --output text |
            tr '\t' '\n' |
            sort -u > all-tags.txt


          while IFS= read -r TAG

          do

            if [[ "$TAG" =~ ^${DEPLOY_ENV}-[0-9]{8}-[0-9]{4}-b[0-9]+$ ]]

            then

              BUILD_NUMBER=$(echo "$TAG" | sed -E 's/.*-b([0-9]+)$/\1/')

              echo "${BUILD_NUMBER}|${TAG}" >> builds.txt

            fi

          done < all-tags.txt


          # Remove duplicate build numbers
          sort -t'|' -k1,1nr -u builds.txt -o builds.txt


          echo ""
          echo "Environment : $DEPLOY_ENV"

          echo "Repository  : $ECR_REPOSITORY"

          echo ""

          echo "Builds found:"

          cat builds.txt || true


      # ========================================================
      # 9. SHOW LATEST 5 BUILDS
      # ========================================================

      - name: Show Latest 5 Builds

        shell: bash

        run: |

          echo ""
          echo "================================================"
          echo "              LATEST 5 BUILDS"
          echo "================================================"

          echo "Environment : $DEPLOY_ENV"

          echo "Repository  : $ECR_REPOSITORY"

          echo ""

          if [ ! -s builds.txt ]; then

            echo "No existing build tags found."

          else

            head -5 builds.txt |
            awk -F'|' '{printf "Build %-5s -> %s\n", $1, $2}'

          fi


          echo "================================================"


      # ========================================================
      # 10. DETERMINE DEPLOYMENT TYPE
      # ========================================================

      - name: Determine Deployment Type

        shell: bash

        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            DEPLOYMENT_TYPE="${{ github.event.inputs.deployment_type }}"

          else

            DEPLOYMENT_TYPE="new"

          fi


          echo "DEPLOYMENT_TYPE=$DEPLOYMENT_TYPE" >> "$GITHUB_ENV"


          echo ""
          echo "=========================================="
          echo "DEPLOYMENT TYPE"
          echo "=========================================="

          echo "$DEPLOYMENT_TYPE"

          echo "=========================================="


      # ========================================================
      # 11. SELECT OR GENERATE IMAGE
      # ========================================================

      - name: Select or Generate Image

        shell: bash

        run: |

          echo ""
          echo "=========================================="
          echo "IMAGE SELECTION"
          echo "=========================================="


          # ======================================================
          # NEW DEPLOYMENT
          # ======================================================

          if [ "$DEPLOYMENT_TYPE" = "new" ]; then


            if [ -s builds.txt ]; then

              MAX_BUILD=$(head -1 builds.txt | cut -d'|' -f1)

            else

              MAX_BUILD=0

            fi


            NEXT_BUILD=$((MAX_BUILD + 1))


            DATE=$(TZ=Asia/Kolkata date +%Y%m%d)

            TIME=$(TZ=Asia/Kolkata date +%H%M)


            IMAGE_TAG="${DEPLOY_ENV}-${DATE}-${TIME}-b${NEXT_BUILD}"


            echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

            echo "BUILD_NEW_IMAGE=true" >> "$GITHUB_ENV"


            echo ""
            echo "NEW DEPLOYMENT"

            echo "Previous Build : b$MAX_BUILD"

            echo "New Build      : b$NEXT_BUILD"

            echo "Image Tag      : $IMAGE_TAG"


          # ======================================================
          # EXISTING IMAGE DEPLOYMENT
          # ======================================================

          else


            case "$DEPLOYMENT_TYPE" in

              latest)
                INDEX=1
                ;;

              latest-1)
                INDEX=2
                ;;

              latest-2)
                INDEX=3
                ;;

              latest-3)
                INDEX=4
                ;;

              latest-4)
                INDEX=5
                ;;

              *)
                echo "ERROR: Invalid deployment type"
                exit 1
                ;;

            esac


            if [ ! -s builds.txt ]; then

              echo "ERROR: No existing builds available."

              echo "Environment: $DEPLOY_ENV"

              exit 1

            fi


            SELECTED_LINE=$(sed -n "${INDEX}p" builds.txt)


            if [ -z "$SELECTED_LINE" ]; then

              echo ""
              echo "ERROR: Requested existing build does not exist."

              echo ""

              echo "Available builds:"

              head -5 builds.txt

              exit 1

            fi


            IMAGE_TAG=$(echo "$SELECTED_LINE" | cut -d'|' -f2)


            echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

            echo "BUILD_NEW_IMAGE=false" >> "$GITHUB_ENV"


            echo ""
            echo "EXISTING IMAGE DEPLOYMENT"

            echo "Selected Image : $IMAGE_TAG"


          fi


          echo "=========================================="


      # ========================================================
      # 12. BUILD DOCKER IMAGE
      # ========================================================

      - name: Build Docker Image

        if: env.BUILD_NEW_IMAGE == 'true'

        shell: bash

        run: |

          echo "=========================================="
          echo "BUILDING DOCKER IMAGE"
          echo "=========================================="


          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" .


      # ========================================================
      # 13. TAG DOCKER IMAGE
      # ========================================================

      - name: Tag Docker Image

        if: env.BUILD_NEW_IMAGE == 'true'

        shell: bash

        run: |

          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"


          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


      # ========================================================
      # 14. PUSH DOCKER IMAGE
      # ========================================================

      - name: Push Docker Image

        if: env.BUILD_NEW_IMAGE == 'true'

        shell: bash

        run: |

          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


          echo "=========================================="
          echo "PUSHING DOCKER IMAGE"
          echo "=========================================="

          echo "Image URI: $IMAGE_URI"


          docker push "$IMAGE_URI"


      # ========================================================
      # 15. VALIDATE IMAGE
      # ========================================================

      - name: Validate ECR Image

        shell: bash

        run: |

          echo "=========================================="
          echo "VALIDATING ECR IMAGE"
          echo "=========================================="


          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].[imageTags[0],imageDigest,imageSizeInBytes,imagePushedAt]' \
            --output table


      # ========================================================
      # 16. RENDER ECS TASK DEFINITION
      # ========================================================

      - name: Render ECS Task Definition

        id: task-def

        uses: aws-actions/amazon-ecs-render-task-definition@v1

        with:

          task-definition: ${{ env.TASK_DEFINITION }}

          container-name: ${{ env.CONTAINER_NAME }}

          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}


      # ========================================================
      # 17. SHOW FINAL IMAGE
      # ========================================================

      - name: Show Final Deployment Image

        shell: bash

        run: |

          echo ""
          echo "=========================================="
          echo "FINAL DEPLOYMENT IMAGE"
          echo "=========================================="

          echo "Environment : $DEPLOY_ENV"

          echo "Repository  : $ECR_REPOSITORY"

          echo "Image       : $IMAGE_TAG"

          echo "ECS Service : $ECS_SERVICE"

          echo "=========================================="


      # ========================================================
      # 18. DEPLOY ECS
      # ========================================================

      - name: Deploy to Amazon ECS

        uses: aws-actions/amazon-ecs-deploy-task-definition@v2

        with:

          task-definition: ${{ steps.task-def.outputs.task-definition }}

          service: ${{ env.ECS_SERVICE }}

          cluster: ${{ env.ECS_CLUSTER }}

          wait-for-service-stability: false


      # ========================================================
      # 19. ENSURE 3 ECS TASKS
      # ========================================================

      - name: Ensure Three ECS Tasks

        shell: bash

        run: |

          echo "=========================================="
          echo "SETTING ECS DESIRED COUNT"
          echo "=========================================="


          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count "$DESIRED_COUNT" \
            --region "$AWS_REGION"


          echo "Desired tasks: $DESIRED_COUNT"


      # ========================================================
      # 20. WAIT FOR ECS STABILITY
      # ========================================================

      - name: Wait For ECS Stability

        shell: bash

        run: |

          echo ""
          echo "Waiting for ECS service stability..."


          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"


          echo "ECS service is stable."


      # ========================================================
      # 21. VERIFY ECS SERVICE
      # ========================================================

      - name: Verify ECS Service

        shell: bash

        run: |

          echo ""
          echo "================================================"
          echo "             ECS SERVICE VERIFICATION"
          echo "================================================"


          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].{
              Service:serviceName,
              Status:status,
              Desired:desiredCount,
              Running:runningCount,
              Pending:pendingCount,
              TaskDefinition:taskDefinition
            }' \
            --output table


      # ========================================================
      # 22. VERIFY THREE TASKS
      # ========================================================

      - name: Verify Three Running Tasks

        shell: bash

        run: |

          echo ""
          echo "================================================"
          echo "             RUNNING ECS TASKS"
          echo "================================================"


          RUNNING_COUNT=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].runningCount' \
            --output text)


          echo "Running Tasks : $RUNNING_COUNT"

          echo "Required Tasks: $DESIRED_COUNT"


          if [ "$RUNNING_COUNT" -lt "$DESIRED_COUNT" ]; then

            echo "ERROR: Not all required tasks are running."

            exit 1

          fi


          echo "All required ECS tasks are running."


      # ========================================================
      # 23. SHOW TASK DETAILS
      # ========================================================

      - name: Show ECS Task Details

        shell: bash

        run: |

          echo ""
          echo "================================================"
          echo "             ECS TASK DETAILS"
          echo "================================================"


          TASK_ARNS=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status RUNNING \
            --region "$AWS_REGION" \
            --query 'taskArns[]' \
            --output text)


          if [ -z "$TASK_ARNS" ]; then

            echo "No running tasks found."

            exit 1

          fi


          aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks $TASK_ARNS \
            --region "$AWS_REGION" \
            --query 'tasks[].{
              Task:taskArn,
              LastStatus:lastStatus,
              DesiredStatus:desiredStatus,
              Health:healthStatus,
              TaskDefinition:taskDefinitionArn
            }' \
            --output table


      # ========================================================
      # 24. DEPLOYMENT SUMMARY
      # ========================================================

      - name: Deployment Summary

        shell: bash

        run: |

          echo ""
          echo "======================================================"
          echo "              DEPLOYMENT SUCCESSFUL"
          echo "======================================================"

          echo "Environment       : $DEPLOY_ENV"

          echo "Deployment Type   : $DEPLOYMENT_TYPE"

          echo "ECR Repository    : $ECR_REPOSITORY"

          echo "Image Tag         : $IMAGE_TAG"

          echo "ECS Cluster       : $ECS_CLUSTER"

          echo "ECS Service       : $ECS_SERVICE"

          echo "Desired Tasks     : $DESIRED_COUNT"

          echo "======================================================"