name: Multi Environment Deployment

on:
  push:
    branches:
      - dev
      - qa
      - production

  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - production

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: ecommerce-cluster
  CONTAINER_NAME: ecommerce-api

  DEV_SERVICE: ecommerce-dev-service
  QA_SERVICE: ecommerce-qa-service
  PROD_SERVICE: ecommerce-prod-service

jobs:

  deploy:
    name: Deploy Ecommerce API

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}

    steps:

      # ==========================================================
      # 1. Checkout Repository
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Configure AWS Credentials
      # ==========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # 3. Login to Amazon ECR
      # ==========================================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================================
      # 4. Decide Environment
      # ==========================================================
      - name: Decide Environment
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="${GITHUB_REF_NAME}"
          fi

          echo "DEPLOY_ENV=$ENV" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Selected Environment: $ENV"
          echo "=========================================="


      # ==========================================================
      # 5. Select ECR Repository + ECS Service + Task Definition
      # ==========================================================
      - name: Select Deployment Resources
        run: |

          if [ "$DEPLOY_ENV" = "dev" ]; then

            echo "ECR_REPOSITORY=ecommerce-api-dev" >> "$GITHUB_ENV"
            echo "SERVICE=$DEV_SERVICE" >> "$GITHUB_ENV"
            echo "TASK=.github/workflows/task-definition-dev.json" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "qa" ]; then

            echo "ECR_REPOSITORY=ecommerce-api-qa" >> "$GITHUB_ENV"
            echo "SERVICE=$QA_SERVICE" >> "$GITHUB_ENV"
            echo "TASK=.github/workflows/task-definition-qa.json" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "production" ]; then

            echo "ECR_REPOSITORY=ecommerce-api-prod" >> "$GITHUB_ENV"
            echo "SERVICE=$PROD_SERVICE" >> "$GITHUB_ENV"
            echo "TASK=.github/workflows/task-definition-prod.json" >> "$GITHUB_ENV"

          else

            echo "Invalid deployment environment: $DEPLOY_ENV"
            exit 1

          fi

          echo "=========================================="
          echo "Environment     : $DEPLOY_ENV"
          echo "ECR Repository  : $ECR_REPOSITORY"
          echo "ECS Service     : $SERVICE"
          echo "Task Definition : $TASK"
          echo "=========================================="


      # ==========================================================
      # 6. Generate Image Version / Build Tag
      # ==========================================================
      - name: Generate Image Version
        run: |

          VERSION="1.0"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          IMAGE_TAG="v${VERSION}.${BUILD_NUMBER}-${DEPLOY_ENV}-b${BUILD_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Application Version : $VERSION"
          echo "Build Number        : $BUILD_NUMBER"
          echo "Environment         : $DEPLOY_ENV"
          echo "Image Tag           : $IMAGE_TAG"
          echo "=========================================="


      # ==========================================================
      # 7. Build Docker Image
      # ==========================================================
      - name: Build Docker Image
        run: |

          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" .


      # ==========================================================
      # 8. Tag Docker Image for ECR
      # ==========================================================
      - name: Tag Docker Image
        run: |

          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"


      # ==========================================================
      # 9. Push Docker Image to ECR
      # ==========================================================
      - name: Push Docker Image
        run: |

          docker push \
            "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"


      # ==========================================================
      # 10. Show Current Image Information
      # ==========================================================
      - name: Show Image Information
        run: |

          echo "=========================================="
          echo "IMAGE DEPLOYMENT INFORMATION"
          echo "=========================================="
          echo "Environment    : $DEPLOY_ENV"
          echo "Repository     : $ECR_REPOSITORY"
          echo "Image Tag      : $IMAGE_TAG"
          echo "Build Number   : $GITHUB_RUN_NUMBER"
          echo "Image URI      : ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "=========================================="


      # ==========================================================
      # 11. Show Latest 5 ECR Images
      # ==========================================================
      - name: Show Latest 5 ECR Images
        run: |

          echo "=========================================="
          echo "LATEST 5 ECR IMAGES"
          echo "=========================================="
          echo "Environment    : $DEPLOY_ENV"
          echo "Repository     : $ECR_REPOSITORY"
          echo "=========================================="

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --filter tagStatus=TAGGED \
            --query 'reverse(sort_by(imageDetails,&imagePushedAt))[:5].[imageTags[0],imagePushedAt,imageDigest]' \
            --output table

          echo "=========================================="


      # ==========================================================
      # 12. Render ECS Task Definition
      # ==========================================================
      - name: Render ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}


      # ==========================================================
      # 13. Deploy to ECS
      # ==========================================================
      - name: Deploy ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # ==========================================================
      # 14. Verify ECS Deployment
      # ==========================================================
      - name: Verify ECS Deployment
        run: |

          echo "=========================================="
          echo "ECS DEPLOYMENT VERIFICATION"
          echo "=========================================="

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].{
              Service:serviceName,
              Status:status,
              Running:runningCount,
              Desired:desiredCount,
              TaskDefinition:taskDefinition
            }' \
            --output table

          echo "=========================================="
          echo "Deployment verification completed."
          echo "=========================================="