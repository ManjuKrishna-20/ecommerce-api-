name: Ecommerce Multi-Environment Deployment

on:
  push:
    branches:
      - dev
      - qa
      - production

  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      build_number:
        description: "Manual build number (leave empty to use GitHub Run Number)"
        required: false
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: ecommerce-cluster
  CONTAINER_NAME: ecommerce-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'production' && 'prod' || github.ref_name) }}

    steps:

      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Configure AWS credentials
      # ============================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # 3. Login to Amazon ECR
      # ============================================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # 4. Select Environment
      # ============================================================
      - name: Select Environment
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ENVIRONMENT="${{ github.event.inputs.environment }}"

          else

            BRANCH="${GITHUB_REF_NAME}"

            if [ "$BRANCH" = "dev" ]; then
              ENVIRONMENT="dev"

            elif [ "$BRANCH" = "qa" ]; then
              ENVIRONMENT="qa"

            elif [ "$BRANCH" = "production" ]; then
              ENVIRONMENT="prod"

            else
              echo "Invalid branch: $BRANCH"
              exit 1
            fi

          fi

          echo "DEPLOY_ENV=$ENVIRONMENT" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Selected Environment : $ENVIRONMENT"
          echo "======================================"


      # ============================================================
      # 5. Select ECR + ECS resources
      # ============================================================
      - name: Select Deployment Resources
        shell: bash
        run: |

          if [ "$DEPLOY_ENV" = "dev" ]; then

            echo "ECR_REPOSITORY=ecommerce-api-dev" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=ecommerce-dev-service" >> "$GITHUB_ENV"
            echo "TASK_DEFINITION=.github/workflows/task-definition-dev.json" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "qa" ]; then

            echo "ECR_REPOSITORY=ecommerce-api-qa" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=ecommerce-qa-service" >> "$GITHUB_ENV"
            echo "TASK_DEFINITION=.github/workflows/task-definition-qa.json" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "prod" ]; then

            echo "ECR_REPOSITORY=ecommerce-api-prod" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=ecommerce-prod-service" >> "$GITHUB_ENV"
            echo "TASK_DEFINITION=.github/workflows/task-definition-prod.json" >> "$GITHUB_ENV"

          else

            echo "Invalid deployment environment"
            exit 1

          fi

          echo "======================================"
          echo "Environment     : $DEPLOY_ENV"
          echo "ECR Repository  : $ECR_REPOSITORY"
          echo "ECS Service     : $ECS_SERVICE"
          echo "Task Definition : $TASK_DEFINITION"
          echo "======================================"


      # ============================================================
      # 6. Generate Image Tag
      #
      # Format:
      # dev-20260811-1247-b21
      # qa-20260811-1300-b22
      # prod-20260811-1330-b23
      # ============================================================
      - name: Generate Image Tag
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.build_number }}" ]; then

            BUILD_NUMBER="${{ github.event.inputs.build_number }}"

          else

            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          fi

          # Validate build number
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Build number must contain only numbers."
            echo "Received: $BUILD_NUMBER"
            exit 1
          fi

          # India Standard Time
          BUILD_DATE=$(TZ=Asia/Kolkata date +"%Y%m%d")
          BUILD_TIME=$(TZ=Asia/Kolkata date +"%H%M")

          # Final image tag
          IMAGE_TAG="${DEPLOY_ENV}-${BUILD_DATE}-${BUILD_TIME}-b${BUILD_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE VERSION"
          echo "======================================"
          echo "Environment : $DEPLOY_ENV"
          echo "Date        : $BUILD_DATE"
          echo "Time        : $BUILD_TIME"
          echo "Build       : $BUILD_NUMBER"
          echo "Image Tag   : $IMAGE_TAG"
          echo "======================================"


      # ============================================================
      # 7. Build Docker Image
      # ============================================================
      - name: Build Docker Image
        shell: bash
        run: |

          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" .

          echo "Docker image built successfully."


      # ============================================================
      # 8. Tag Docker Image
      # ============================================================
      - name: Tag Docker Image
        shell: bash
        run: |

          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Docker image tagged successfully."


      # ============================================================
      # 9. Push Docker Image to ECR
      # ============================================================
      - name: Push Docker Image
        shell: bash
        run: |

          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "======================================"
          echo "PUSHING DOCKER IMAGE"
          echo "======================================"
          echo "Repository : $ECR_REPOSITORY"
          echo "Image Tag  : $IMAGE_TAG"
          echo "Image URI  : $IMAGE_URI"
          echo "======================================"

          docker push "$IMAGE_URI"


      # ============================================================
      # 10. Show Current Image Information
      # ============================================================
      - name: Show Image Information
        shell: bash
        run: |

          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "======================================"
          echo "DEPLOYMENT IMAGE INFORMATION"
          echo "======================================"
          echo "Environment : $DEPLOY_ENV"
          echo "Repository  : $ECR_REPOSITORY"
          echo "Build       : $BUILD_NUMBER"
          echo "Image Tag   : $IMAGE_TAG"
          echo "Image URI   : $IMAGE_URI"
          echo "======================================"


      # ============================================================
      # 11. Show Latest 5 Builds
      #
      # IMPORTANT:
      # Only new-format images are selected:
      #
      # dev-YYYYMMDD-HHMM-bNUMBER
      #
      # Old images such as:
      # v1.0.20-dev-b20
      #
      # are ignored.
      #
      # Builds are sorted numerically:
      #
      # b21
      # b20
      # b19
      # b18
      # b17
      # ============================================================
      - name: Show Latest 5 Builds
        shell: bash
        run: |

          echo "=============================================="
          echo "LATEST 5 BUILDS"
          echo "=============================================="
          echo "Environment : $DEPLOY_ENV"
          echo "Repository  : $ECR_REPOSITORY"
          echo "=============================================="

          # Get all tags from ECR
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'imageDetails[?imageTags != null].imageTags[]' \
            --output text \
          | tr '\t' '\n' \
          | grep "^${DEPLOY_ENV}-[0-9]\{8\}-[0-9]\{4\}-b[0-9]\+$" \
          | awk -F'-' '{build=substr($NF,2); print build "|" $0}' \
          | sort -t'|' -k1,1nr \
          | head -5 \
          | awk -F'|' '{printf "Build %-5s %s\n", $1, $2}'

          echo "=============================================="
          echo "Latest 5 builds displayed successfully."
          echo "=============================================="


      # ============================================================
      # 12. Render ECS Task Definition
      # ============================================================
      - name: Render ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}


      # ============================================================
      # 13. Deploy to Amazon ECS
      # ============================================================
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # ============================================================
      # 14. Verify ECS Deployment
      # ============================================================
      - name: Verify ECS Deployment
        shell: bash
        run: |

          echo "======================================"
          echo "ECS DEPLOYMENT VERIFICATION"
          echo "======================================"

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].{
              Service:serviceName,
              Status:status,
              Running:runningCount,
              Desired:desiredCount,
              TaskDefinition:taskDefinition
            }' \
            --output table

          echo "======================================"
          echo "Deployment completed successfully."
          echo "======================================"