name: Ecommerce Multi-Environment Deployment

on:
  push:
    branches:
      - dev
      - qa
      - production

  workflow_dispatch:
    inputs:
      action:
        description: "Select action"
        required: true
        type: choice
        options:
          - deploy
          - rollback

      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      rollback_version:
        description: "Rollback image"
        required: false
        type: choice
        options:
          - latest
          - latest-1
          - latest-2
          - latest-3
          - latest-4

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: ecommerce-cluster
  CONTAINER_NAME: ecommerce-api

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'production' && 'prod' || github.ref_name) }}

    steps:

      # ---------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # 2. Configure AWS
      # ---------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ---------------------------------------------------
      # 3. Login to ECR
      # ---------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ---------------------------------------------------
      # 4. Select Environment
      # ---------------------------------------------------

      - name: Select Environment
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ENVIRONMENT="${{ github.event.inputs.environment }}"

          else

            BRANCH="${GITHUB_REF_NAME}"

            if [ "$BRANCH" = "dev" ]; then
              ENVIRONMENT="dev"

            elif [ "$BRANCH" = "qa" ]; then
              ENVIRONMENT="qa"

            elif [ "$BRANCH" = "production" ]; then
              ENVIRONMENT="prod"

            else
              echo "Invalid branch: $BRANCH"
              exit 1
            fi

          fi

          echo "DEPLOY_ENV=$ENVIRONMENT" >> "$GITHUB_ENV"

          echo "Selected Environment: $ENVIRONMENT"


      # ---------------------------------------------------
      # 5. Select ECR Repository + ECS Service
      # ---------------------------------------------------

      - name: Select Deployment Resources
        run: |

          if [ "$DEPLOY_ENV" = "dev" ]; then

            echo "ECR_REPOSITORY=ecommerce-api-dev" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=ecommerce-dev-service" >> "$GITHUB_ENV"
            echo "TASK_DEFINITION=.github/workflows/task-definition-dev.json" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "qa" ]; then

            echo "ECR_REPOSITORY=ecommerce-api-qa" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=ecommerce-qa-service" >> "$GITHUB_ENV"
            echo "TASK_DEFINITION=.github/workflows/task-definition-qa.json" >> "$GITHUB_ENV"

          elif [ "$DEPLOY_ENV" = "prod" ]; then

            echo "ECR_REPOSITORY=ecommerce-api-prod" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=ecommerce-prod-service" >> "$GITHUB_ENV"
            echo "TASK_DEFINITION=.github/workflows/task-definition-prod.json" >> "$GITHUB_ENV"

          else

            echo "Invalid deployment environment"
            exit 1

          fi

          echo "ECR Repository: $ECR_REPOSITORY"
          echo "ECS Service: $ECS_SERVICE"


      # ---------------------------------------------------
      # 6. NORMAL DEPLOYMENT - CREATE NEW IMAGE
      # ---------------------------------------------------

      - name: Generate Image Tag
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy' }}
        run: |

          VERSION="1.0"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          IMAGE_TAG="v${VERSION}.${BUILD_NUMBER}-${DEPLOY_ENV}-b${BUILD_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "New Image"
          echo "Version      : $VERSION"
          echo "Build Number : $BUILD_NUMBER"
          echo "Environment  : $DEPLOY_ENV"
          echo "Image Tag    : $IMAGE_TAG"
          echo "======================================"


      # ---------------------------------------------------
      # 7. BUILD DOCKER IMAGE
      # ---------------------------------------------------

      - name: Build Docker Image
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy' }}
        run: |

          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" .


      # ---------------------------------------------------
      # 8. TAG IMAGE
      # ---------------------------------------------------

      - name: Tag Docker Image
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy' }}
        run: |

          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"


      # ---------------------------------------------------
      # 9. PUSH IMAGE TO ECR
      # ---------------------------------------------------

      - name: Push Docker Image
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'deploy' }}
        run: |

          docker push \
            "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"


      # ---------------------------------------------------
      # 10. GET LAST 5 IMAGES
      # ---------------------------------------------------

      - name: Get Last 5 Images
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' }}
        id: get-images
        run: |

          echo "Getting last 5 images from ECR..."

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --filter tagStatus=TAGGED \
            --query 'sort_by(imageDetails,&imagePushedAt)[-5:]' \
            --output json > images.json

          echo ""
          echo "======================================"
          echo "LAST 5 AVAILABLE IMAGES"
          echo "======================================"

          cat images.json | jq -r '
            reverse |
            .[] |
            "\(.imagePushedAt)  \(.imageTags[0])"
          '

          echo "======================================"


      # ---------------------------------------------------
      # 11. SELECT ROLLBACK IMAGE
      # ---------------------------------------------------

      - name: Select Rollback Image
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' }}
        run: |

          ROLLBACK_INDEX="0"

          case "${{ github.event.inputs.rollback_version }}" in

            latest)
              ROLLBACK_INDEX=0
              ;;

            latest-1)
              ROLLBACK_INDEX=1
              ;;

            latest-2)
              ROLLBACK_INDEX=2
              ;;

            latest-3)
              ROLLBACK_INDEX=3
              ;;

            latest-4)
              ROLLBACK_INDEX=4
              ;;

            *)
              echo "Invalid rollback selection"
              exit 1
              ;;

          esac

          IMAGE_TAG=$(cat images.json | jq -r "
            sort_by(.imagePushedAt) |
            reverse |
            .[$ROLLBACK_INDEX].imageTags[0]
          ")

          if [ "$IMAGE_TAG" = "null" ] || [ -z "$IMAGE_TAG" ]; then
            echo "Rollback image not found"
            exit 1
          fi

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo ""
          echo "======================================"
          echo "ROLLBACK IMAGE SELECTED"
          echo "Environment : $DEPLOY_ENV"
          echo "Repository  : $ECR_REPOSITORY"
          echo "Image Tag   : $IMAGE_TAG"
          echo "======================================"


      # ---------------------------------------------------
      # 12. SHOW FINAL IMAGE
      # ---------------------------------------------------

      - name: Show Image Information
        run: |

          echo "======================================"
          echo "DEPLOYMENT INFORMATION"
          echo "======================================"
          echo "Environment : $DEPLOY_ENV"
          echo "Repository  : $ECR_REPOSITORY"
          echo "Image Tag   : $IMAGE_TAG"
          echo "ECS Service : $ECS_SERVICE"
          echo "ECS Cluster : $ECS_CLUSTER"
          echo "======================================"


      # ---------------------------------------------------
      # 13. RENDER ECS TASK DEFINITION
      # ---------------------------------------------------

      - name: Render ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}


      # ---------------------------------------------------
      # 14. DEPLOY TO ECS
      # ---------------------------------------------------

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # ---------------------------------------------------
      # 15. VERIFY ECS
      # ---------------------------------------------------

      - name: Verify ECS Deployment
        run: |

          echo "======================================"
          echo "ECS DEPLOYMENT VERIFICATION"
          echo "======================================"

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{Service:serviceName,Status:status,Running:runningCount,Desired:desiredCount,TaskDefinition:taskDefinition}' \
            --output table

          echo "======================================"
          echo "Deployment completed successfully"
          echo "======================================"